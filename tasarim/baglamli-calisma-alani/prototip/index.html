<title>ArvoLAB Bağlamlı Çalışma Alanı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=Newsreader:opsz,wght@6..72,500&display=swap">
<style>
/*
  TASARIM PROTOTİPİ — uygulama kodu DEĞİL (tasarim/baglamli-calisma-alani).
  İki katman: (1) prototip kabuğu: görüntüleyicinin temasını izler; (2) uygulama
  çerçevesi: .app[data-tema] ile kendi açık/koyu paletini taşır, böylece iki tema
  aynı sayfada karşılaştırılabilir. Uygulama paleti önerilen yeni kimliktir:
  açıkta sakin beyaz/açık gri, koyuda lacivert-gri, ölçülü lacivert vurgu.
  Yerleşim: masaüstü 1440×900 çerçeve ölçeklenir; telefon 390×844.
*/
:root {
  --k-zemin: #f4f6f9; --k-yuzey: #ffffff; --k-yazi: #141b2b; --k-soluk: #5b6475; --k-cizgi: #dfe4ec; --k-vurgu: #1d3a6b;
  --k-etiket-mevcut: #e3efe0; --k-etiket-mevcut-y: #355a2a; --k-etiket-gelistir: #fbefd9; --k-etiket-gelistir-y: #7a4b08; --k-etiket-taklit: #e8ecf5; --k-etiket-taklit-y: #31446b;
  --yazi: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --k-zemin: #0d1422; --k-yuzey: #141c2d; --k-yazi: #e6e9ef; --k-soluk: #9aa3b4; --k-cizgi: #27324a; --k-vurgu: #9db6e0;
  --k-etiket-mevcut: #1f3322; --k-etiket-mevcut-y: #a9cf98; --k-etiket-gelistir: #3a2c12; --k-etiket-gelistir-y: #f0c677; --k-etiket-taklit: #1e2a44; --k-etiket-taklit-y: #b9c8e8; color-scheme: dark } }
:root[data-theme="dark"] {
  --k-zemin: #0d1422; --k-yuzey: #141c2d; --k-yazi: #e6e9ef; --k-soluk: #9aa3b4; --k-cizgi: #27324a; --k-vurgu: #9db6e0;
  --k-etiket-mevcut: #1f3322; --k-etiket-mevcut-y: #a9cf98; --k-etiket-gelistir: #3a2c12; --k-etiket-gelistir-y: #f0c677; --k-etiket-taklit: #1e2a44; --k-etiket-taklit-y: #b9c8e8; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--k-zemin); color: var(--k-yazi); font-family: var(--yazi); font-size: 14px; }
.kabuk { max-width: 1520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 16px; }
.kabuk-bas { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.kabuk-bas h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.kabuk-bas p { margin: 4px 0 0; color: var(--k-soluk); font-size: 13px; max-width: 70ch; }
.denetim { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.secici { display: inline-flex; border: 1px solid var(--k-cizgi); border-radius: 6px; overflow: hidden; background: var(--k-yuzey); }
.secici button { border: 0; background: transparent; color: var(--k-soluk); font: inherit; font-size: 13px; padding: 7px 12px; cursor: pointer; min-height: 34px; }
.secici button:disabled { opacity: .45; cursor: default; }
.secici button[aria-pressed="true"] { background: var(--k-vurgu); color: var(--k-yuzey); }
.secici button:focus-visible, .ekranlar button:focus-visible { outline: 2px solid var(--k-vurgu); outline-offset: 2px; }
.ekranlar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.ekranlar button { flex: none; border: 1px solid var(--k-cizgi); background: var(--k-yuzey); color: var(--k-yazi); font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.ekranlar button[aria-current="true"] { border-color: var(--k-vurgu); box-shadow: inset 0 0 0 1px var(--k-vurgu); font-weight: 600; }
.ekranlar b { font-variant-numeric: tabular-nums; color: var(--k-soluk); font-weight: 600; margin-right: 6px; }
.aciklama { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: start; background: var(--k-yuzey); border: 1px solid var(--k-cizgi); border-radius: 8px; padding: 14px 16px; }
.aciklama h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.aciklama p { margin: 0; color: var(--k-soluk); font-size: 13px; line-height: 1.55; max-width: 90ch; }
.aciklama ul { margin: 8px 0 0; padding-left: 18px; color: var(--k-soluk); font-size: 13px; line-height: 1.55; }
.etiketler { display: flex; flex-wrap: wrap; gap: 6px; justify-content: end; }
.etiket { font-size: 12px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
.etiket.mevcut { background: var(--k-etiket-mevcut); color: var(--k-etiket-mevcut-y); }
.etiket.gelistir { background: var(--k-etiket-gelistir); color: var(--k-etiket-gelistir-y); }
.etiket.taklit { background: var(--k-etiket-taklit); color: var(--k-etiket-taklit-y); }
@media (max-width: 760px) { .aciklama { grid-template-columns: 1fr; } .etiketler { justify-content: start; } }
.sahne { display: grid; gap: 16px; }
.cerceve-dis { position: relative; width: 100%; overflow: hidden; border-radius: 10px; border: 1px solid var(--k-cizgi); background: var(--k-yuzey); }
.cerceve { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.telefonlar { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
.telefon-sutun { display: grid; gap: 8px; justify-items: center; width: min(320px, 100%); }
.telefon-sutun .cerceve-dis { border-radius: 22px; }
.telefon-sutun figcaption, .yanyana figcaption { font-size: 13px; color: var(--k-soluk); text-align: center; max-width: 34ch; line-height: 1.45; }
.yanyana { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; align-items: start; }
.yanyana figure, .telefon-sutun { margin: 0; }
.yanyana figure { display: grid; gap: 8px; }
.yanyana figcaption { text-align: left; max-width: none; }
.not { font-size: 12px; color: var(--k-soluk); }

/* ───────── UYGULAMA ÇERÇEVESİ: önerilen kimlik ───────── */
.app {
  --bg: #f6f7f9; --yuzey: #ffffff; --yuzey-2: #f1f3f6; --yuzey-3: #e9edf2; --cizgi: #e2e6ec; --cizgi-g: #d3d9e2;
  --yazi: #141b2b; --yazi-2: #3c4557; --soluk: #5d6677; --vurgu: #1f3d6e; --vurgu-hover: #183257; --vurgu-zemin: #e8eef8; --vurgu-yazi: #ffffff;
  --basari: #4e7a32; --basari-zemin: #e6f0de; --uyari: #8a5a0b; --uyari-zemin: #fbf0dc; --hata: #a3322b;
  --vurgu-sari: #fbe58a; --kagit: #ffffff; --kagit-yazi: #1a1a1a; --golge: 0 1px 2px rgba(20, 27, 43, 0.06);
  --fs-govde: 14px; --fs-ikincil: 12.5px; --fs-kucuk: 12px; --fs-panel: 15px; --fs-sayfa: 26px;
  font-family: var(--yazi); font-size: var(--fs-govde); color: var(--yazi); background: var(--bg);
  width: 1440px; height: 900px; display: grid; grid-template-columns: auto minmax(0, 1fr); overflow: hidden; line-height: 1.45;
}
.app[data-tema="koyu"] {
  --bg: #0f1625; --yuzey: #151d2e; --yuzey-2: #121a2a; --yuzey-3: #1c2639; --cizgi: #243049; --cizgi-g: #2f3c57;
  --yazi: #e7eaf0; --yazi-2: #c3c9d4; --soluk: #9aa3b3; --vurgu: #6f8fc6; --vurgu-hover: #87a3d3; --vurgu-zemin: #1d2b47; --vurgu-yazi: #0c1424;
  --basari: #95c47c; --basari-zemin: #1d3020; --uyari: #e9bf6c; --uyari-zemin: #352a14; --hata: #f08d84;
  --vurgu-sari: #8a7a2c; --kagit: #1b2334; --kagit-yazi: #e4e6ea; --golge: none;
}
.app.tek { grid-template-columns: 1fr; }
.app.telefon { width: 390px; height: 844px; display: flex; flex-direction: column; }
.app.telefon > * { flex: none; }
.app.telefon > .tel-govde { flex: 1; min-height: 0; }
.app button, .app input, .app select { font: inherit; color: inherit; }
.app svg { flex: none; }
/* Sol alan: genel/çalışma gezinmesi ve genişleyen araç alanı aynı yuva */
.sol { background: var(--yuzey); border-right: 1px solid var(--cizgi); display: flex; flex-direction: column; min-height: 0; transition: width 180ms ease; }
.sol.dar { width: 236px; } .sol.liste { width: 300px; } .sol.genis { width: 372px; }
.sol-bas { padding: 14px 14px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--cizgi); }
.logo { display: block; width: 118px; aspect-ratio: 4.22; object-fit: cover; object-position: center; }
.logo-k { display: none; } .app[data-tema="koyu"] .logo-a { display: none; } .app[data-tema="koyu"] .logo-k { display: block; }
.sol-govde { flex: 1; min-height: 0; overflow: auto; padding: 8px; display: grid; align-content: start; gap: 2px; }
.sol-alt { border-top: 1px solid var(--cizgi); padding: 8px; display: grid; gap: 2px; }
.ogre { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 10px; border-radius: 6px; color: var(--yazi-2); font-size: 14px; font-weight: 500; border: 0; background: transparent; text-align: left; cursor: pointer; width: 100%; }
.ogre:hover { background: var(--yuzey-2); }
.ogre[aria-current="page"] { background: var(--vurgu-zemin); color: var(--vurgu); }
.ogre .say { margin-left: auto; font-size: 12px; color: var(--soluk); font-variant-numeric: tabular-nums; font-weight: 500; }
.grup { font-size: 12px; color: var(--soluk); font-weight: 500; padding: 14px 10px 4px; }
.don { display: flex; align-items: center; gap: 6px; color: var(--soluk); font-size: 13px; font-weight: 500; border: 0; background: transparent; padding: 4px 2px; cursor: pointer; }
.calisma-ad { font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--yazi); }
.calisma-ust { font-size: 12px; color: var(--soluk); }
.hesap { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--yuzey-3); font-size: 12px; font-weight: 600; color: var(--yazi-2); }
.hesap b { font-size: 13px; font-weight: 600; display: block; } .hesap span { font-size: 12px; color: var(--soluk); }
.ana { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.ust { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--cizgi); background: var(--yuzey); }
.ust .ad { font-size: 14px; font-weight: 600; }
.ara { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 34px; width: 340px; padding: 0 10px; border: 1px solid var(--cizgi); border-radius: 6px; color: var(--soluk); font-size: 13px; background: var(--yuzey-2); }
.ara kbd { margin-left: auto; font-family: inherit; font-size: 11px; border: 1px solid var(--cizgi); border-radius: 4px; padding: 1px 5px; background: var(--yuzey); }
.ikon-d { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--yazi-2); cursor: pointer; }
.ikon-d:hover { background: var(--yuzey-2); }
.icerik { flex: 1; min-height: 0; overflow: auto; }
.sayfa { max-width: 920px; margin: 0 auto; padding: 40px 32px; display: grid; gap: 28px; align-content: start; }
.sayfa h1 { margin: 0; font-size: var(--fs-sayfa); font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
.sayfa .alt { margin: 6px 0 0; color: var(--soluk); font-size: 14px; }
.d { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 6px; font-size: 14px; font-weight: 500; border: 1px solid var(--cizgi-g); background: var(--yuzey); color: var(--yazi); cursor: pointer; white-space: nowrap; }
.d.b { background: var(--vurgu); border-color: var(--vurgu); color: var(--vurgu-yazi); }
.d.b:hover { background: var(--vurgu-hover); }
.d.s { height: 30px; padding: 0 10px; font-size: 13px; }
.d.y { border-color: transparent; background: transparent; color: var(--vurgu); padding: 0 6px; }
.bolum-bas { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.bolum-bas h2 { margin: 0; font-size: 15px; font-weight: 600; }
.bolum-bas a, .bag { color: var(--vurgu); font-size: 13px; font-weight: 500; text-decoration: none; }
.devam { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 20px; border: 1px solid var(--cizgi); border-radius: 8px; background: var(--yuzey); box-shadow: var(--golge); }
.devam h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.meta { font-size: var(--fs-ikincil); color: var(--soluk); display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
.cubuk { height: 4px; border-radius: 4px; background: var(--yuzey-3); overflow: hidden; margin-top: 12px; max-width: 360px; }
.cubuk i { display: block; height: 100%; background: var(--basari); }
.satirlar { border-top: 1px solid var(--cizgi); }
.satir { display: grid; grid-template-columns: minmax(0, 1fr) 120px 110px 90px; gap: 16px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--cizgi); font-size: 14px; cursor: pointer; }
.satir:hover { background: var(--yuzey-2); }
.satir .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.satir span { color: var(--soluk); font-size: var(--fs-ikincil); font-variant-numeric: tabular-nums; }
.satir.bas { cursor: default; font-size: 12px; color: var(--soluk); padding-block: 6px; } .satir.bas:hover { background: transparent; }
.ilk { display: grid; gap: 20px; padding: 32px; border: 1px solid var(--cizgi); border-radius: 10px; background: var(--yuzey); max-width: 620px; }
.ilk ol { margin: 0; padding-left: 18px; color: var(--yazi-2); display: grid; gap: 6px; font-size: 14px; }
.ilk .eylem { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
/* Diyalog */
.ort { position: absolute; inset: 0; background: rgba(15, 22, 37, 0.42); display: grid; place-items: center; }
.app { position: relative; }
.diyalog { width: 520px; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 10px; box-shadow: 0 16px 48px rgba(10, 16, 30, 0.22); display: grid; }
.diyalog-bas { padding: 20px 24px 4px; display: flex; justify-content: space-between; align-items: start; }
.diyalog-bas h2 { margin: 0; font-size: 18px; font-weight: 600; }
.diyalog-bas p { margin: 4px 0 0; color: var(--soluk); font-size: 13px; }
.diyalog-govde { padding: 16px 24px 4px; display: grid; gap: 16px; }
.alan { display: grid; gap: 6px; }
.alan label, .alan .lbl { font-size: 13px; font-weight: 500; color: var(--yazi-2); }
.alan .ipucu { font-size: 12px; color: var(--soluk); }
.girdi { height: 38px; border: 1px solid var(--cizgi-g); border-radius: 6px; padding: 0 12px; background: var(--yuzey); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.girdi.odak { border-color: var(--vurgu); box-shadow: 0 0 0 3px var(--vurgu-zemin); }
.segment { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--cizgi-g); border-radius: 6px; overflow: hidden; }
.segment button { border: 0; border-right: 1px solid var(--cizgi-g); background: var(--yuzey); padding: 9px 8px; font-size: 13.5px; font-weight: 500; color: var(--yazi-2); cursor: pointer; display: grid; gap: 2px; }
.segment button:last-child { border-right: 0; }
.segment button small { font-size: 11.5px; color: var(--soluk); font-weight: 400; }
.segment button[aria-pressed="true"] { background: var(--vurgu-zemin); color: var(--vurgu); box-shadow: inset 0 0 0 1px var(--vurgu); }
.diyalog-alt { padding: 16px 24px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sessiz { font-size: 12px; color: var(--soluk); line-height: 1.5; }
/* Editör */
.ed-bas { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--cizgi); background: var(--yuzey); }
.ed-bas .bolum { font-size: 14px; font-weight: 600; } .ed-bas .yol { font-size: 13px; color: var(--soluk); }
.kayit { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--soluk); margin-left: auto; }
.kayit i { width: 7px; height: 7px; border-radius: 50%; background: var(--basari); }
.arac { height: 44px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--cizgi); background: var(--yuzey); }
.arac .ayrac { width: 1px; height: 20px; background: var(--cizgi); margin: 0 6px; }
.arac button { height: 30px; min-width: 30px; padding: 0 7px; border: 0; border-radius: 5px; background: transparent; font-size: 13px; color: var(--yazi-2); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.arac button:hover { background: var(--yuzey-2); }
.arac .sec { height: 30px; padding: 0 8px; border: 1px solid var(--cizgi); border-radius: 5px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--yazi-2); }
.calisma-alan { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; }
.belge-kap { min-width: 0; overflow: auto; background: var(--bg); padding: 28px 24px 60px; }
.kagit { max-width: 760px; margin: 0 auto; background: var(--kagit); color: var(--kagit-yazi); border: 1px solid var(--cizgi); box-shadow: var(--golge); padding: 64px 72px; font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; line-height: 1.75; }
.kagit h2 { font-size: 17px; margin: 0 0 10px; font-weight: 700; } .kagit h3 { font-size: 15px; margin: 18px 0 8px; font-weight: 700; }
.kagit p { margin: 0 0 12px; text-align: justify; }
.atif { color: var(--vurgu); border-bottom: 1px dotted var(--vurgu); cursor: pointer; }
.secim { background: var(--vurgu-zemin); box-shadow: 0 0 0 1px var(--vurgu-zemin); }
.yuzen { position: absolute; display: flex; gap: 2px; padding: 4px; background: var(--yuzey); border: 1px solid var(--cizgi-g); border-radius: 8px; box-shadow: 0 8px 24px rgba(10, 16, 30, 0.16); font-family: var(--yazi); }
.yuzen button { border: 0; background: transparent; padding: 6px 9px; border-radius: 5px; font-size: 13px; color: var(--yazi-2); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.yuzen button:hover { background: var(--yuzey-2); }
.atif-kart { position: absolute; width: 330px; background: var(--yuzey); border: 1px solid var(--cizgi-g); border-radius: 8px; box-shadow: 0 8px 24px rgba(10, 16, 30, 0.16); padding: 12px 14px; font-family: var(--yazi); display: grid; gap: 8px; font-size: 13px; }
.atif-kart b { font-size: 13.5px; font-weight: 600; }
.atif-kart .eylemler { display: flex; gap: 6px; flex-wrap: wrap; }
/* Sağ panel */
.sag { border-left: 1px solid var(--cizgi); background: var(--yuzey); display: flex; flex-direction: column; min-height: 0; }
.sag.ai { width: 396px; } .sag.pdf { width: 520px; }
.tutamac { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; }
.tutamac::after { content: ""; position: absolute; left: 3px; top: 50%; width: 2px; height: 28px; margin-top: -14px; border-radius: 2px; background: var(--cizgi-g); }
.panel-bas { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--cizgi); }
.panel-bas h2 { margin: 0; font-size: var(--fs-panel); font-weight: 600; }
.sekmeler { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--cizgi); }
.sekmeler button { border: 0; background: transparent; padding: 8px 8px 10px; font-size: 13px; font-weight: 500; color: var(--soluk); border-bottom: 2px solid transparent; cursor: pointer; }
.sekmeler button[aria-selected="true"] { color: var(--yazi); border-bottom-color: var(--vurgu); }
.panel-govde { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; display: grid; gap: 12px; align-content: start; }
.panel-alt { border-top: 1px solid var(--cizgi); padding: 12px 16px; display: grid; gap: 8px; }

      <div class="orn"><span class="olcu">${L("Düğme · 14/500 · 36 px (telefonda 44)", "Button · 14/500 · 36 px (44 on phone)")}</span><span><span class="d b">${L("Devam et", "Continue")}</span></span></div>
      <div class="orn"><span class="olcu">${L("İkincil · 12,5/400 · araç çubuğu 13/400", "Secondary · 12.5/400 · toolbar 13/400")}</span><span style="font-size:12.5px;color:var(--soluk)">${L("Tez · 12 dk önce · 8.420 kelime", "Thesis · 12 min ago · 8,420 words")}</span></div>
      <div class="orn" style="border:0"><span class="olcu">${L("Belge paragrafı · değişmez", "Document paragraph · unchanged")}</span><span style="font-family:'Times New Roman',serif;font-size:15px;line-height:1.75">Uzaktan öğrenme, pandemi döneminde yükseköğretimin varsayılan biçimi hâline geldi.</span></div></div></div>`;
    return `<div class="yanyana"><figure>${olcekli(mevcut, 700, 760)}<figcaption>${L("Mevcut (a076d9d, ölçülen değerler).", "Current (a076d9d, measured values).")}</figcaption></figure><figure>${olcekli(oneri, 700, 760)}<figcaption>${L("Önerilen. Mobil form girişleri en az 16 px.", "Proposed. Mobile form inputs at least 16 px.")}</figcaption></figure></div>`;
  };

  const TELEFON = {
    1: [() => telIlk(), () => L("Yeni öğrenci: tek eylem, 48 px düğme. Alt çubuk genel seviyede.", "New student: one action, 48 px button. Bottom bar at main level.")],
    2: [() => telAna(), () => L("Devam et tek baskın eylem; yeni çalışma başlıkta ikincil.", "Continue is the only dominant action; New is secondary in the header.")],
    3: [() => telYeni(), () => L("Tam ekran; girdiler 16 px, birincil düğme altta, klavyeyle çakışmaz.", "Full screen; inputs 16 px, primary button at the bottom, clear of the keyboard.")],
    5: [() => telCalismaMenu(), () => L("Çalışma gezinmesi telefonda alttaki 'Çalışma' sekmesinden açılan yaprak; genel menüyle yığılmaz.", "On the phone, work navigation is a sheet from the 'Work' tab; never stacked with the main menu.")],
    6: [() => telArama(), () => L("Arama tam ekran. Geri 'Belge' — sorgu ve süzgeç saklanır.", "Search full screen. Back 'Document' — query and filters kept.")],
    7: [() => telPdf(), () => L("PDF tam ekran, pasaj vurgulu. Geri 'Sonuçlar'.", "PDF full screen, passage highlighted. Back 'Results'.")],
    8: [() => telAi(), () => L("AI tam ekran; cevap yalnızca kullanıcının düğmesiyle belgeye girer.", "AI full screen; the answer enters the document only by the user's button.")],
  };
  const olcekli = (html, g, y) => `<div class="cerceve-dis" style="aspect-ratio:${g}/${y}" data-g="${g}"><div class="cerceve" style="width:${g}px;height:${y}px">${html.replace('class="app', `style="width:${g}px;height:${y}px" class="app`)}</div></div>`;
  const olcekle = () => document.querySelectorAll(".cerceve-dis").forEach((d) => { const s = d.clientWidth / +d.dataset.g; d.firstElementChild.style.transform = `scale(${s})`; });

  function ciz() {
    const e = ekranlar[durum.ekran];
    document.getElementById("ekranlar").innerHTML = ekranlar.slice(1).map((x, i) => `<button type="button" data-ekran="${i + 1}" aria-current="${durum.ekran === i + 1}"><b>${i + 1}</b>${x.ad()}</button>`).join("");
    document.getElementById("aciklama").innerHTML = `<div><h2>${durum.ekran}. ${e.ad()}</h2><p>${e.ne()}</p></div><div class="etiketler">${e.etiket.map(([s, y]) => `<span class="etiket ${s}">${{ mevcut: L("Mevcut", "Exists"), gelistir: L("Geliştirme", "To build"), taklit: L("Taklit", "Mock") }[s]} · ${y}</span>`).join("")}</div>`;
    const sahne = document.getElementById("sahne");
    const tel = TELEFON[durum.ekran];
    sahne.innerHTML = durum.ekran === 4 ? ciz4() : durum.ekran === 9 ? ciz9() : durum.ekran === 10 ? ciz10()
      : durum.cihaz === "tel" && tel ? `<div class="telefonlar"><figure class="telefon-sutun">${olcekli(tel[0](), 390, 844)}<figcaption>${tel[1]()}</figcaption></figure></div>`
      : olcekli(e.ciz(), 1440, 900);
    document.querySelectorAll("[data-cihaz]").forEach((b) => { b.setAttribute("aria-pressed", String(b.dataset.cihaz === durum.cihaz)); b.disabled = !TELEFON[durum.ekran] && [4, 10].includes(durum.ekran); });
    document.querySelectorAll("[data-tema]").forEach((b) => b.tagName === "BUTTON" && b.setAttribute("aria-pressed", String(b.dataset.tema === durum.tema)));
    document.querySelectorAll("[data-dil]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.dil === durum.dil)));
    document.documentElement.lang = durum.dil;
    olcekle();
  }
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-ekran],[data-tema],[data-dil],[data-cihaz],[data-git],[data-arama],[data-kaynak],[data-ai]");
    if (!b) return;
    if (b.dataset.ekran) durum.ekran = +b.dataset.ekran;
    else if (b.tagName === "BUTTON" && b.dataset.tema && b.closest(".secici")) { durum.tema = b.dataset.tema; kaydet(); }
    else if (b.dataset.dil) { durum.dil = b.dataset.dil; kaydet(); }
    else if (b.dataset.cihaz) { durum.cihaz = b.dataset.cihaz; kaydet(); }
    else if (b.dataset.git) durum.ekran = +b.dataset.git;
    else if (b.dataset.arama) durum.aramaSecili = +b.dataset.arama;
    else if (b.dataset.kaynak) durum.kaynakSecili = +b.dataset.kaynak;
    else if (b.dataset.ai) durum.aiSekme = b.dataset.ai;
    else return;
    if (b.dataset.ekran || b.dataset.git) history.replaceState(null, "", `#ekran-${durum.ekran}`);
    ciz();
  });
  addEventListener("hashchange", () => { const m = location.hash.match(/^#ekran-(\d+)$/); if (m) { durum.ekran = +m[1]; ciz(); } });
  addEventListener("resize", olcekle);
  ciz();
})();
</script>
