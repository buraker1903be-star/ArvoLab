name: Academic Directory

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"
  pull_request:
    paths:
      - "scripts/academic-directory/**"
      - "package.json"
      - ".github/workflows/academic-directory.yml"

permissions:
  contents: read

jobs:
  validate-and-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate crawler syntax
        run: npm run academic-directory:check

      - name: Crawl official academic sources
        run: npm run academic-directory:crawl

      - name: Upload generated directory files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-directory-${{ github.run_id }}
          path: data/academic-directory/
          if-no-files-found: warn
          retention-days: 14
